<!-- @name: Xarita
     @idea: 14 hudud sxematik xaritada raqamlangan; bosilgan hudud yon paneldagi tuman va mahalla ro'yxatini ochadi, ro'yxat ustidagi kursor esa xaritani yoritadi.
     @best:  Operator hududni nomi bo'yicha emas, joylashuvi bo'yicha eslasa; «qaysi chekka», «qo'shni tuman» savoli muhim bo'lganda.
     @cost:  Xarita hudud va butun respublika darajasida gapira oladi — tuman va mahalla unda ko'rinmaydi; ustuni torayganda (katak 44px dan kichik) u ko'rsatkichga aylanadi va butun yuk ro'yxatga tushadi. -->
<section class="v4" data-variant="4" aria-labelledby="v4-title">
  <h3 class="v4-title" id="v4-title" hidden>Xarita</h3>
  <div class="v4-grid">
    <!-- Xarita BUTUNLAY `aria-hidden`: yonidagi ro'yxat xuddi shu tanlovni to'liq nom bilan beradi.
         Chizmani tasvirlash ham, bir tanlovni ikki marta Tab zanjiriga qo'yish ham — yuk, foyda emas. -->
    <figure class="v4-mapwrap tile" aria-hidden="true">
      <svg class="v4-map" id="v4-svg" viewBox="0 0 480 300" focusable="false"></svg>
      <span class="v4-maphint mono" id="v4-maphint">Butun respublika</span>
      <figcaption class="v4-cap hint">Sxematik chizma: chegaralar taxminiy, rasmiy karta emas.
        <span class="v4-cap-wide">Hududni bosing; hududlar tashqarisidagi bo‘sh joy — butun respublika.</span><span class="v4-cap-narrow">Bu kenglikda xarita katagi 44px dan kichik — u faqat ko‘rsatkich; tanlash «Butun respublika» tugmasi va ro‘yxatdan.</span>
        Tuman va mahalla xaritada ko‘rsatilmaydi — ular ro‘yxatda tanlanadi.</figcaption>
    </figure>
    <div class="v4-panel">
      <!-- Butun respublika ro‘yxat qatori EMAS, doimiy tugma. Qator bo‘lganida u tumanga kirilishi bilan yo‘qolardi
           va qaytish yo‘li faqat kichkina yo‘l tugmasi edi — eng ko‘p ishlatiladigan qamrov eng chuqur ko‘milgani. -->
      <button type="button" class="v4-all-btn" id="v4-all">
        <span class="v4-all-ring" aria-hidden="true"><svg class="ico" aria-hidden="true" focusable="false"><use href="#i-globe"/></svg></span>
        <span class="v4-all-txt"><span class="v4-all-name">Butun respublika</span><span class="v4-all-sub" id="v4-all-sub"></span></span>
        <span class="v4-all-pop mono" id="v4-all-pop">—</span>
      </button>
      <nav class="v4-crumbs" id="v4-crumbs" aria-label="Tanlangan qamrov yo‘li"></nav>
      <p class="eyebrow eyebrow-sm" id="v4-lvl"></p>
      <ul class="v4-list" id="v4-list" role="list" aria-labelledby="v4-lvl"></ul>
      <div class="v4-sum" id="v4-sum"></div>
      <p class="sr-only" role="status" id="v4-live"></p>
    </div>
  </div>
  <p class="note v4-note"><svg class="ico" aria-hidden="true" focusable="false"><use href="#i-circle-alert"/></svg>
    <span>Bu — ko‘rinish namunasi: server yo‘q, hech narsa yuborilmaydi. Aholi raqamlari namuna reestridan olingan <b>taxminiy</b> qiymatlar.</span></p>
</section>
<style>

<script>
(function () {
  "use strict";
  var root = document.querySelector('[data-variant="4"]');
  if (!root) return;
  var GEO = window.OM_GEO || {}, NAMES = Object.keys(GEO).filter(function (k) { return GEO[k] && typeof GEO[k] === "object"; }) /* buzuq yozuv (null) butun variantni oldirmasin */;
  var q = function (n) { return root.querySelector("#v4-" + n); };
  var svg = q("svg"), listEl = q("list"), crumbEl = q("crumbs"), sumEl = q("sum"), lvlEl = q("lvl"), liveEl = q("live");

  /* Reestr yuklanmasa qamrov TANLANMAYDI. «0 kishi» yolg'on bo'lardi: nol «hech kim» degani, bu yerda esa «bilmaymiz». */
  if (!NAMES.length) {
    crumbEl.hidden = lvlEl.hidden = listEl.hidden = allBtn.hidden = true; root.querySelector(".v4-mapwrap").hidden = true;
    /* Butun jumla BITTA `<span>` ichida: `.note` — flex konteyner, bo'lingan matn 12px oraliqli tor ustunlarga siqilardi. */
    sumEl.innerHTML = '<p class="note note-crit">' + WARN + '<span>Hudud reestri (<span class="mono">OM_GEO</span> — <span class="mono">assets/composer-data.js</span>) yuklanmadi. Qamrovni tanlab bo‘lmaydi va taxminiy raqam ham ko‘rsatilmaydi.</span></p>';
    return;
  }
  /* [reestr nomining boshlanishi, path, raqam X, raqam Y] — soddalashtirilgan, rasmiy karta emas. */
  var MAP = [
    ["Qoraqalpog", "M14 16 152 16 152 92 120 128 58 148 14 116Z", 80, 74], ["Xorazm", "M50 158 110 138 126 164 104 196 58 192Z", 88, 168], ["Navoiy", "M156 18 268 30 288 82 278 96 242 130 188 140 156 102Z", 216, 80], ["Buxoro", "M128 162 182 144 238 138 250 192 204 224 144 208Z", 192, 182], ["Samarqand", "M252 138 298 128 330 156 320 188 282 196 248 172Z", 288, 162],
    ["Jizzax", "M296 80 332 66 352 104 336 142 302 118 292 94Z", 322, 104], ["Qashqadaryo", "M244 208 296 202 338 222 330 262 272 266 240 238Z", 288, 236], ["Surxondaryo", "M342 232 378 216 408 246 398 292 352 288 338 262Z", 372, 258], ["Toshkent viloyati", "M344 16 440 12 464 56 440 100 398 94 390 58 346 54Z", 424, 48],
    ["Toshkent shahri", "M352 58 394 60 398 96 360 100 344 80Z", 372, 82], ["Sirdaryo", "M352 108 396 100 410 130 378 150 352 138Z", 378, 126], ["Namangan", "M414 106 462 100 472 136 432 148 410 132Z", 440, 126], ["Farg", "M398 152 432 158 436 186 406 200 384 176Z", 412, 176], ["Andijon", "M440 152 474 146 478 180 444 190 434 172Z", 456, 172]
  ];
  var CHEV = '<svg class="ico v4-chev" aria-hidden="true" focusable="false"><use href="#i-chevron-right"/></svg>';
  function esc(s) { return String(s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
  function pad(n) { return (n < 10 ? "0" : "") + n; }
  /* Yaxlitlash composer bilan bir xil — 2 400 kishini «~2K» ga aylantirib yubormaydi. */
  function fmt(n) { if (n >= 1e6) return (n / 1e6).toFixed(1).replace(/\.0$/, "") + "M";
    return n >= 1e4 ? Math.round(n / 1e3) + "K" : n >= 1e3 ? (n / 1e3).toFixed(1).replace(/\.0$/, "") + "K" : String(n); }
  /* Son yo'q bo'lsa «~0» emas, «—»: nol «hech kim» degani, tire «reestr aytmagan» degani. */
  function num(n) { return (typeof n === "number" && isFinite(n) && n > 0) ? "~" + fmt(n) : "—"; } /* 0 va NaN ham "—": ular reach() da ham null */
  var noPop = NAMES.filter(function (n) { var p = GEO[n].pop; return !(typeof p === "number" && isFinite(p) && p > 0); }); /* 0/NaN ham "raqam yo'q" — aks holda jami NaN bo'lib chiqardi */
  /* Bitta hududning soni yetishmasa respublika yig'indisi ham YO'Q: `|| 0` qisman yig'indini «butun respublika» deb ko'rsatardi — o'ylab topilgan fakt. */
  var TOTAL = noPop.length ? null : NAMES.reduce(function (s, n) { return s + GEO[n].pop; }, 0);
  /* Tugma yozuvi bir marta yoziladi va boshqa o‘zgarmaydi: respublika yig‘indisi ham, hudud soni ham reestr bilan qotgan.

  allPop.textContent = num(TOTAL);
  allSub.textContent = "Reestrdagi barcha " + NAMES.length + " hudud" + (TOTAL == null ? " · jami son noma’lum" : "");
  function dists(r) { return (GEO[r] && GEO[r].districts) || {}; }
  function mahs(r, d) { var x = dists(r)[d]; return (x && x.mahallas) || {}; }
  var st = { level: null, region: null, district: null, mahalla: null }, lastSig = "";
  function reach() { var v = st.level === "republic" ? TOTAL : st.level === "region" ? GEO[st.region].pop
    : st.level === "district" ? dists(st.region)[st.district].pop : st.level === "mahalla" ? mahs(st.region, st.district)[st.mahalla] : null;
    return typeof v === "number" && isFinite(v) && v > 0 ? v : null; }  /* 0 ham `null`: «~0 kishi» fakt bo‘lib chiqmasin */
  /* «barcha» so'zi faqat REESTR haqida gapiradi: fragment reestrning to'liqligini bilmaydi. */
  function pathText() { if (!st.level) return null;
    if (st.level === "republic") return "O‘zbekiston Respublikasi — reestrdagi barcha " + NAMES.length + " hudud";
    return [st.region, st.district, st.mahalla].filter(Boolean).join(" / "); }
  /* Nom reestrda topilmasa shakl chizilmaydi — hech qayerga olib bormaydigan hudud bosilmasin. */
  var cells = {}, NS = "http://www.w3.org/2000/svg";

  svg.appendChild(mk("rect", { "class": "v4-back", x: "0", y: "0", width: "480", height: "300" }));
  MAP.forEach(function (m) {
    var name = null, i;
    for (i = 0; i < NAMES.length; i++) if (NAMES[i].indexOf(m[0]) === 0) { name = NAMES[i]; break; }
    if (!name || cells[name]) return;
    var g = mk("g", { "class": "v4-cell", "data-r": name, "data-state": "idle" }), p = mk("path", { "class": "v4-rg", d: m[1] });
    var t = mk("text", { "class": "v4-num", x: m[2], y: m[3] }), ttl = mk("title", {});
    ttl.textContent = name + " · " + num(GEO[name].pop) + " kishi (taxminiy)"; t.textContent = pad(NAMES.indexOf(name) + 1);

  });
  /* Reestrdagi bo'shliq JIM qolmasin: ekran «hammasi shu yerda» degan taassurot bermasin. */
  var gaps = [], noCell = NAMES.filter(function (n) { return !cells[n]; });
  if (noPop.length) gaps.push("aholi soni yo‘q — " + noPop.join(", ")); if (noCell.length) gaps.push("xaritada ko‘rsatilmagan — " + noCell.join(", "));
  if (gaps.length) crumbEl.insertAdjacentHTML("beforebegin", '<p class="note note-warn">' + WARN +
    '<span>Reestr to‘liq emas: ' + esc(gaps.join("; ")) + '. Bu hududlar uchun taxminiy raqam ham, respublika yig‘indisi ham ko‘rsatilmaydi.</span></p>');
  function rowsFor() {
    if (st.level === "region") return Object.keys(dists(st.region)).map(function (n, i) { return { k: "district", n: n, p: dists(st.region)[n].pop, idx: i + 1, deep: true }; });
    if (st.level === "district" || st.level === "mahalla") { var m = mahs(st.region, st.district);
      return Object.keys(m).map(function (n, i) { return { k: "mahalla", n: n, p: m[n], idx: i + 1 }; }); }
    var out = [];
    NAMES.forEach(function (n, i) { out.push({ k: "region", n: n, p: GEO[n].pop, idx: i + 1, deep: true }); }); return out;
  }
  /* `aria-current` — `aria-pressed` EMAS: qator «bosilgan/bo'shatilgan» emas, «hozirgi tanlov». Qayta bosish holatni o'zgartirmaydi, demak o'chirilishini va'da qilish yolg'on bo'lardi. */
  function renderList() {
    var rows = rowsFor();
    if (!rows.length) { listEl.innerHTML = '<li class="v4-empty hint">Reestrda bu pog‘ona uchun yozuv yo‘q — qamrov yuqoridagi darajada qoladi.</li>'; return; }
    listEl.innerHTML = rows.map(function (it) {
      var on = it.k === "mahalla" && st.mahalla === it.n;
      return '<li><button type="button" class="v4-row" data-kind="' + it.k + '" data-name="' + esc(it.n) + '"' + (on ? ' aria-current="true"' : "") + ">" +
        '<span class="v4-idx mono">' + pad(it.idx) + "</span>" + '<span class="v4-name">' + esc(it.n) + (it.sub ? ' <span class="v4-sub">· ' + esc(it.sub) + "</span>" : "") + "</span>" + '<span class="v4-pop mono">' + num(it.p) + "</span>" + (it.deep ? CHEV : "") + "</button></li>";
    }).join("");
  }
  /* Crumb sof navigatsiya EMAS — u qamrovni o'sha darajaga KO'TARADI, shuning uchun label harakatni aytadi: «qaytish» desa, ko'r foydalanuvchi 450 ming o'rniga 35 millionni tasdiqlab qo'yardi. */
  function renderCrumbs() {
    if (!st.level) { crumbEl.innerHTML = '<span class="v4-crumb v4-crumb-off">Qamrov hali tanlanmagan</span>'; return; }
    var cr = [{ t: "republic", l: "O‘zbekiston", a: "Qamrovni butun respublikaga o‘zgartirish" }];
    if (st.region) cr.push({ t: "region", l: st.region, a: "Qamrovni butun " + st.region + "ga o‘zgartirish" });
    if (st.district) cr.push({ t: "district", l: st.district, a: "Qamrovni butun " + st.district + "ga o‘zgartirish" }); if (st.mahalla) cr.push({ t: "mahalla", l: st.mahalla });
    crumbEl.innerHTML = cr.map(function (c, i) {
      return (i ? '<span class="v4-sep" aria-hidden="true">/</span>' : "") + (i === cr.length - 1 ? '<span class="v4-crumb" aria-current="true">' + esc(c.l) + "</span>"
        : '<button type="button" class="v4-crumb v4-crumb-btn" data-up="' + c.t + '" aria-label="' + esc(c.a) + '">' + esc(c.l) + "</button>");
    }).join("");
  }
  function renderSum() {
    if (!st.level) return void (sumEl.innerHTML = '<div class="empty"><span class="empty-icon"><svg class="ico" aria-hidden="true" focusable="false"><use href="#i-map-pin"/></svg></span><p class="empty-title">Qamrov tanlanmagan</p><p>Butun respublika uchun yuqoridagi tugmani bosing; tor qamrov uchun xaritadan hududni yoki ro‘yxatdan qatorni tanlang. Xabar kimga ketishini tizim o‘zi taxmin qilmaydi.</p></div>');
    var r = reach(), share = r == null || TOTAL == null ? null : (r / TOTAL) * 100;
    sumEl.innerHTML = '<p class="eyebrow eyebrow-sm">Taxminiy qamrov</p><p class="v4-reach"><b>' + num(r) + "</b><span>" +
      (r == null ? "reestrda bu pog‘ona uchun son yo‘q" : "kishi" + (st.level === "republic" ? " · reestrdagi barcha hududlar" : share == null ? "" : " · reestrdagi jami aholining " + (share < 0.1 ? "0,1% dan kam" : "~" + share.toFixed(1).replace(".", ",") + "%"))) +
      '</span></p><p class="v4-path">' + esc(pathText()) + '</p><p class="hint">Raqam namuna reestridan olingan taxmin — aniq son emas; yuborishdan oldin reestrdan yangilanadi.</p>';
  }
  function rowByName(n) { var a = listEl.querySelectorAll(".v4-row"), i;
    for (i = 0; i < a.length; i++) if (a[i].getAttribute("data-name") === n) return a[i]; return null; }
  /* Yuqoriga chiqish tugmasi bo‘lmasa (eng yuqori pog‘ona) — doimiy tugma. ArrowLeft hech qachon hech qayerga olib bormay qolmaydi. */
  function upBtn() { var b = crumbEl.querySelectorAll(".v4-crumb-btn"); return b.length ? b[b.length - 1] : allBtn; }
  function render(moveFocus, silent) {
    var act = document.activeElement === document.body && preRow ? preRow : document.activeElement, keep = listEl.contains(act) ? act.getAttribute("data-name") : null;
    renderCrumbs(); renderList(); renderSum();
    /* Tugma QAYTA YARATILMAYDI — atribut almashadi, shuning uchun undagi fokus va o‘tish animatsiyasi joyida qoladi. */
    if (st.level === "republic") allBtn.setAttribute("aria-current", "true"); else allBtn.removeAttribute("aria-current");
    Object.keys(cells).forEach(function (n) { cells[n].setAttribute("data-state",
      st.level === "republic" ? "on" : !st.region ? "idle" : n === st.region ? "on" : "dim"); });
    var rows = listEl.querySelectorAll(".v4-row"), r = reach();
    lvlEl.textContent = st.level === "region" ? "Tumanlar va shaharlar · " + rows.length : (st.level === "district" || st.level === "mahalla") ? "Mahallalar (MFY) · " + rows.length : "Hududlar · " + NAMES.length;
    /* Ekran o'quvchi uchun HAL QILUVCHI raqam — qamrov; yo'lning o'zi tanlov bo'lganini ham aytmaydi. */
    liveEl.textContent = st.level ? pathText() + " tanlandi. Taxminiy qamrov " + (r == null ? "noma’lum" : num(r) + " kishi") + ". " + lvlEl.textContent + "."
      : "Qamrov tanlanmagan. " + lvlEl.textContent + ".";
    /* `innerHTML` fokusdagi tugmani yo'q qiladi — fokus <body> ga tushsa, keyingi Tab butun hujjat boshidan boshlanardi.
       Shuning uchun: o'sha nomli qator qolgan bo'lsa — o'sha; ro'yxat butunlay almashgan bo'lsa — birinchi qator; ro'yxat bo'sh bo'lsa — yuqoriga chiqish tugmasi. */
    var f = keep == null ? null : rowByName(keep);
    /* Respublikaga o‘tilganda fokus RO‘YXATGA sakramaydi: bosilgan yo‘l tugmasi yo‘qoldi, uning o‘rnini bosgan nishon — doimiy tugma. */
    if (!f && (moveFocus || keep != null)) f = listEl.querySelector('.v4-row[aria-current="true"]') || (st.level === "republic" ? allBtn : null) || rows[0] || upBtn();
    if (f) f.focus();
    /* Holat o'zgarmagan bo'lsa hodisa YO'Q: audit jurnaliga bo'lmagan o'zgarish yozilmasin. */
    var sig = [st.level, st.region, st.district, st.mahalla, r].join("|");
    if (!silent && sig !== lastSig) { lastSig = sig; root.dispatchEvent(new CustomEvent("scopechange", { bubbles: true,
      detail: { level: st.level, region: st.region, district: st.district, mahalla: st.mahalla, reach: r } })); }
  }
  /* Turgan joying = qamroving. Yuqoriga chiqqanda pastdagi tanlov TOZALANADI — aks holda ekran «viloyat» deb turib, ichida eski mahallani ushlab qolardi. */
  function go(level, name, moveFocus) {
    if (level === "republic") { st.region = st.district = st.mahalla = null; }
    else if (level === "region") { if (name) st.region = name; st.district = st.mahalla = null; }
    else if (level === "district") { if (name) st.district = name; st.mahalla = null; } else if (name) st.mahalla = name;
    st.level = level; render(moveFocus);
  }
  /* Xarita va ro'yxat bir-birini yoritadi — sichqoncha ostida ham, klaviatura fokusida ham. */
  function hot(t) {
    var c = t && t.closest && (t.closest(".v4-cell") || t.closest('.v4-row[data-kind="region"]'));
    var name = c ? c.getAttribute("data-r") || c.getAttribute("data-name") : null;
    /* Fon yoki doimiy tugma ustidagi kursor «hammasi» ni OLDINDAN ko‘rsatadi: butun xarita yumshoq alangaga bo‘yaladi va yorliq chiqadi. */
    var all = !c && !!(t && t.closest && (t.closest(".v4-back") || t.closest(".v4-all-btn")));
    root.setAttribute("data-allhot", all ? "true" : "false");
    allBtn.setAttribute("data-hot", all ? "true" : "false");
    Object.keys(cells).forEach(function (k) { cells[k].setAttribute("data-hot", k === name ? "true" : "false"); });
    listEl.querySelectorAll('.v4-row[data-kind="region"]').forEach(function (b) { b.setAttribute("data-hot", b.getAttribute("data-name") === name ? "true" : "false"); });
  }
  var preRow = null;  /* sichqoncha bosishi fokusni tugmadan blur qiladi — `click` ga qadar. Kim fokusda turganini shu yerda eslaymiz, `render()` uni tiklaydi. */
  root.addEventListener("pointerdown", function () { preRow = listEl.contains(document.activeElement) ? document.activeElement : null; });
  root.addEventListener("click", function (e) {
    var t = e.target, row = t.closest && t.closest(".v4-row"), up = t.closest && t.closest(".v4-crumb-btn"), cell = t.closest && t.closest(".v4-cell");
    var all = t.closest && t.closest(".v4-all-btn"), back = t.closest && t.closest(".v4-back");
    if (row) go(row.getAttribute("data-kind"), row.getAttribute("data-name"), true); else if (up) go(up.getAttribute("data-up"), null, true);
    /* `moveFocus` YO‘Q: tugma o‘z joyida qoladi va `aria-current` bilan tanlovni o‘zi tasdiqlaydi — fokusni ro‘yxatga uloqtirish kerak emas. */
    else if (all) go("republic", null, false);
    else if (cell) go("region", cell.getAttribute("data-r"), false);
    else if (back) go("republic", null, false);
  });
  root.addEventListener("keydown", function (e) {
    var row = e.target.closest && e.target.closest(".v4-row"), k = e.key;
    if (!row) return;
    var all = [].slice.call(listEl.querySelectorAll(".v4-row")), i = all.indexOf(row), to = -1;
    if (k === "ArrowDown") to = Math.min(i + 1, all.length - 1); else if (k === "ArrowUp") to = Math.max(i - 1, 0);
    else if (k === "Home") to = 0; else if (k === "End") to = all.length - 1;
    else if (k === "ArrowRight" && row.querySelector(".v4-chev")) { e.preventDefault(); return go(row.getAttribute("data-kind"), row.getAttribute("data-name"), true); }
    /* ArrowLeft faqat FOKUSNI yuqoriga chiqish tugmasiga ko'chiradi: o'q tugmasi qamrovni tasdiqlamasin — tasdiq Enter/Space/bosish bilan, ataylab bo'ladi. */
    else if (k === "ArrowLeft") { var b = upBtn(); if (b) { e.preventDefault(); b.focus(); } return; }
    else return;
    e.preventDefault(); all[to].focus();
  });
  ["pointerover", "focusin"].forEach(function (t) { root.addEventListener(t, function (e) { hot(e.target); }); }); ["pointerleave", "focusout"].forEach(function (t) { root.addEventListener(t, function () { hot(null); }); });
  render(false, true);
})();
</script>
