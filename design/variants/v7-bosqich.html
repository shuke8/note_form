<!-- @name: Bosqichma-bosqich
     @idea: Bir vaqtda faqat bitta savol turadi — javob berilgach keyingisi ochiladi, javob berilgani tepada yig'ilgan qatorga aylanadi.
     @best:  Kamdan-kam kiradigan yoki kam tayyorgarlikli operator uchun: har ekranda bitta qaror, adashadigan joy yo'q.
     @cost:  Tajribalisiga sekin — to'rt qadam to'rtta bosish, pog'onalarni yonma-yon solishtirib bo'lmaydi. -->
<section class="v7" data-variant="7" aria-labelledby="v7-title">
  <h3 class="v7-title" id="v7-title" hidden>Bosqichma-bosqich</h3>
  <ol class="v7-trail" id="v7-trail"></ol>
  <div class="v7-stage v7-anim" id="v7-stage" tabindex="-1"></div>
  <div class="v7-res" id="v7-res" tabindex="-1" role="group" aria-label="Tanlangan qamrov"></div>
  <!-- Status mintaqasi kontent yozilishidan OLDIN DOM da turishi shart — shuning uchun u markupda, JS uni yaratmaydi. -->
  <p class="sr-only" id="v7-say" role="status"></p>
</section>

<style>
  .v7 { display:flex; flex-direction:column; gap:var(--gap-row); }
  /* Host bo'lim kengligini o'zi boshqaradi (`.vx-mount > section`) — u bilan urishmay, o'qish uzunligini bolalarda cheklaymiz. */
  .v7 > *:not(.sr-only) { width:100%; max-width:720px; }

  /* Yig'ilgan javoblar — tinch qatorlar, ayni paytda «orqaga» boshqaruvi: har biri o'z savolini qayta ochadi. */
  .v7-trail { display:flex; flex-direction:column; gap:6px; }  .v7-trail:empty { display:none; }
  .v7-crumb { width:100%; display:flex; flex-wrap:wrap; align-items:baseline; gap:3px 10px; min-height:44px; padding:9px 14px; text-align:left; color:var(--ink-2); border:1px solid var(--hairline); border-radius:var(--r-5); background:var(--ghost-quiet); }
  /* `transition` shorthand ikki qoidada yozilsa keyingisi oldingisini QO'SHMAYDI, o'chiradi — crumb ikkala sinfni oladi, o'tishi shu yerda birlashtirilgan. */
  .v7-crumb.v7-anim { transition:background var(--d-hover) var(--ease-out), opacity var(--d-pane) var(--ease-out), transform var(--d-tap) var(--ease-out); }
  @media (hover:hover) { .v7-crumb:hover { background:var(--ghost); } }  .v7-crumb:active { transform:scale(0.99); }
  .v7-crumb-k { flex:none; min-width:62px; }  /* qiymatlar ustun bo'lib tekislansin */
  .v7-crumb-v { flex:1 1 140px; min-width:0; color:var(--ink); font-weight:500; overflow-wrap:anywhere; }  .v7-crumb-e { flex:none; font-size:var(--t-sm); color:var(--accent-ink); }

  .v7-stage { padding-top:4px; }  /* faol savol ramkasiz — yig'ilgan qatorlardan ochiqligi bilan ajraladi */
  .v7-q { margin:6px 0 4px; font-family:var(--display); font-size:var(--t-lead); line-height:1.25; letter-spacing:var(--ls-lead); font-weight:500; color:var(--ink); }
  .v7-opts { display:grid; gap:8px; margin-top:14px; grid-template-columns:repeat(auto-fill, minmax(min(100%, 232px), 1fr)); }  .v7-lvls { grid-template-columns:repeat(auto-fit, minmax(min(100%, 152px), 1fr)); }
  .v7-opt { width:100%; justify-content:space-between; text-align:left; }
  .v7-opt-name { min-width:0; overflow-wrap:anywhere; }  .v7-opt-reach { flex:none; font-size:var(--t-mono-sm); color:var(--ink-2); }
  /* Grid qatori kartalarni o'zi tenglashtiradi; `justify-content` tiklanadi — `.v7-opt` dagi `space-between` ustunda izohni karta tagiga itarardi. */
  .v7-lvl { flex-direction:column; align-items:flex-start; justify-content:flex-start; gap:4px; padding:15px 16px; border-radius:var(--r-5); }
  .v7-lvl-name { font-size:var(--t-body); font-weight:500; color:var(--ink); letter-spacing:var(--ls-body); }  .v7-lvl-note { font-size:var(--t-sm); line-height:1.4; color:var(--ink-2); }
  .v7 .seg-btn[disabled] { opacity:0.45; }  /* `.btn[disabled]` bilan bir xil — `.seg-btn` da bunday qoida yo'q */
  /* Tanlanganda `.seg-btn` matnni `--paper` ga o'tkazadi — bolalari ergashsin. */
  .v7 .seg-btn[aria-checked="true"] .v7-lvl-name { color:var(--paper); }
  .v7 .seg-btn[aria-checked="true"] .v7-lvl-note, .v7 .seg-btn[aria-checked="true"] .v7-opt-reach { color:var(--paper); opacity:0.72; }

  .v7-res { padding:18px; border:1px solid var(--hairline); border-radius:var(--r-5); background:var(--paper-alt); }  .v7-res[data-state="empty"] { padding:0; border:0; background:none; }
  .v7-num { margin-top:6px; font-size:var(--t-d3); line-height:1.15; font-weight:500; color:var(--ink); }  .v7-num-u { margin-inline-start:2px; font-family:var(--sans); font-size:var(--t-ui); letter-spacing:0; color:var(--ink-2); }
  .v7-path { margin-top:8px; font-size:var(--t-body); line-height:var(--lh-body); letter-spacing:var(--ls-body); color:var(--ink); overflow-wrap:anywhere; }  .v7-sep { padding-inline:4px; color:var(--ink-2); }
  .v7-res .hint, .v7-res .note { margin-top:8px; }  .v7-res .btn { margin-top:14px; }

  /* Ochilish: faqat transform + opacity, 240ms (--d-pane). */
  .v7-anim { transition:opacity var(--d-pane) var(--ease-out), transform var(--d-pane) var(--ease-out); }  .v7-anim[data-enter="1"] { opacity:0; transform:translateY(8px); }
  @media (prefers-reduced-motion: reduce) { .v7-anim, .v7-crumb.v7-anim { transition:none; } .v7-anim[data-enter="1"] { opacity:1; transform:none; } }
</style>

<script>
  (function () {
    "use strict";
    var root = document.querySelector('[data-variant="7"]');
    if (!root) return;
    var GEO = window.OM_GEO || {}, REGIONS = Object.keys(GEO).filter(function (k) { return GEO[k] && typeof GEO[k] === "object"; }) /* buzuq yozuv (null) butun variantni oldirmasin */;
    var trail = root.querySelector("#v7-trail"), stage = root.querySelector("#v7-stage"), res = root.querySelector("#v7-res"), live = root.querySelector("#v7-say");
    var ICO = 'fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"';
    /* O'lchamsiz `viewBox` li SVG uyasini to'ldirib yuboradi: `.empty-icon` da 40px bo'lib, stroke 1.6 ekranda 2.67px chiqardi. */
    function svg(inner) { return '<svg viewBox="0 0 24 24" width="20" height="20" ' + ICO + '>' + inner + '</svg>'; }
    var WARN = svg('<circle cx="12" cy="12" r="9"/><path d="M12 7.5v5.5M12 16h.01"/>');
    function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }

    /* Ma'lumot yo'q — sabab ko'rsatiladi. «0» YOZILMAYDI: nol «hech kim» degan ma'noni berardi, holbuki bu yuklanish xatosi. */
    if (!REGIONS.length) {
      trail.hidden = stage.hidden = res.hidden = true;
      root.insertAdjacentHTML("beforeend", '<p class="note note-crit">' + WARN + '<span><b>Hudud ro‘yxati yuklanmadi.</b> composer-data.js ' +
        'yetib kelmagani uchun qamrovni tanlab bo‘lmaydi. Sahifani qayta yuklang; takrorlansa administratorga xabar bering.</span></p>');
      return;
    }

    /* `0` yoki yo'q qiymat «hech kim yashamaydi» EMAS, «raqam yo'q» degani — bu farq oxirigacha saqlanadi. */
    function num(n) { return typeof n === "number" && isFinite(n) && n > 0 ? n : null; }
    var TOTAL = { pop: 0, districts: 0, mahallas: 0 };
    REGIONS.forEach(function (r) {
      var p = num(GEO[r].pop), ds = GEO[r].districts || {};
      TOTAL.pop = p == null || TOTAL.pop == null ? null : TOTAL.pop + p;   // bitta viloyat raqamsiz — jami ham yolg'on bo'lardi
      Object.keys(ds).forEach(function (d) { TOTAL.districts += 1; TOTAL.mahallas += Object.keys(ds[d].mahallas || {}).length; });
    });

    var KEYS = ["level", "region", "district", "mahalla"];
    /* Daraja tugmasida aholi raqami YO'Q: bu qadamda aniqlik darajasi tanlanadi. Izohdagi son —
       TO'PLAMDAGI birliklar soni, mamlakat holati emas: composer-data.js har tumandan namuna beradi. */
    function lvlNote(n, w) { return n ? "Ro‘yxatdagi " + n + " " + w : "Ma’lumot to‘plamida bu pog‘ona yo‘q"; }
    var LEVELS = [
      { v: "republic", name: "Respublika", note: "Barcha " + REGIONS.length + " hudud, butun mamlakat" },
      { v: "region",   name: "Viloyat",    note: lvlNote(REGIONS.length, "hududdan biri") },
      { v: "district", name: "Tuman",      note: lvlNote(TOTAL.districts, "tumandan biri"), off: !TOTAL.districts },
      { v: "mahalla",  name: "Mahalla",    note: lvlNote(TOTAL.mahallas, "MFY dan biri"), off: !TOTAL.mahallas }
    ];
    var ASK = { level: "Qaysi darajada?", region: "Qaysi viloyat?", district: "Qaysi tuman?", mahalla: "Qaysi mahalla?" };
    /* Katta harf — `.eyebrow` ning ishi: `text-transform` nutqqa ta'sir qilmaydi, katta harfli qisqa so'zni esa ayrim SR harflab o'qiydi. */
    var TAG = { level: "Daraja", region: "Viloyat", district: "Tuman", mahalla: "Mahalla" };
    var HINT_L = "Xabar qaysi pog‘onada tarqatilishini tanlang — keyingi savollar shunga qarab ochiladi.";
    var HINT_G = "Yonidagi raqam — o‘sha hududning taxminiy aholisi. Aniq son reestrdan olinadi.";
    function hintFor(k) { return k === "level" ? HINT_L : HINT_G + (k === "mahalla" ? " Ro‘yxatda har tumanning namunaviy MFY lari bor — to‘liq reestr emas." : ""); }
    var S = { level: null, region: null, district: null, mahalla: null };
    var editing = null, active = null, shown = 0;   // tahrirlanayotgan · ochiq savol · trailda ko'rinayotgan javoblar soni

    /* 10K dan past qiymatda o'nlik saqlanadi — aks holda mahalladagi 2 400 kishi «~2K» ga yaxlitlanardi. */
    function fmt(n) {
      if (n >= 1e6) return (n / 1e6).toFixed(1).replace(/\.0$/, "") + "M";
      return n >= 1e4 ? Math.round(n / 1e3) + "K" : n >= 1e3 ? (n / 1e3).toFixed(1).replace(/\.0$/, "") + "K" : String(n);
    }
    /* Ekran o'quvchi `~` ni odatiy sozlamada O'QIMAYDI — «~450K» «450K» bo'lib, taxmin aniq songa aylanardi. Aytiladigan nusxa alohida. */
    function spoken(n) { return "taxminan " + (n >= 1e4 ? fmt(n).replace("M", " million").replace("K", " ming") : String(n)) + " kishi"; }
    function dsOf() { return (GEO[S.region] && GEO[S.region].districts) || {}; }
    function msOf() { var d = dsOf()[S.district]; return (d && d.mahallas) || {}; }
    var LV = LEVELS.map(function (l) { return l.v; });  // KEYS bilan bir tartibda: [republic, region, district, mahalla]
    function levelName() { return S.level ? LEVELS[LV.indexOf(S.level)].name : ""; }
    /* Savollar soni darajaga bog'liq: Respublika — bittasi, Mahalla — to'rttasi. */
    function steps() { return !S.level || S.level === "republic" ? ["level"] : KEYS.slice(0, LV.indexOf(S.level) + 1); }
    function reach() {   // har pog'onada obyektning O'ZI ham tekshiriladi: reestr o'zgarsa kalit qolib, qiymat yo'qolishi mumkin
      if (S.level === "republic") return TOTAL.pop;
      if (S.level === "region") return S.region && GEO[S.region] ? num(GEO[S.region].pop) : null;
      if (S.level === "district") { var d = dsOf()[S.district]; return d ? num(d.pop) : null; }
      return S.level === "mahalla" && S.mahalla ? num(msOf()[S.mahalla]) : null;
    }
    function pathParts() { return S.level === "republic" ? ["O‘zbekiston Respublikasi"] : [S.region, S.district, S.mahalla].filter(Boolean); }
    function optionsFor(k) {
      if (k === "level") return LEVELS;
      var src = k === "region" ? GEO : k === "district" ? dsOf() : msOf();
      return Object.keys(src).map(function (name) { return { v: name, name: name, n: num(k === "mahalla" ? src[name] : src[name] && src[name].pop) }; });
    }
    function clearBelow(k) { var i = KEYS.indexOf(k); KEYS.forEach(function (kk, j) { if (j > i) S[kk] = null; }); }
    /* Boshlang'ich holat reflow bilan qayd etilmasa o'tish umuman ko'rinmaydi. */
    function enter(el) { el.setAttribute("data-enter", "1"); void el.offsetWidth; el.removeAttribute("data-enter"); }
    /* `radio` + `aria-checked`: bular toggle emas, bitta javob. `aria-pressed` oldinga oqimda hech qachon `true` bo'lmasdi — SR 14 marta «bosilmagan toggle» derdi. */
    function optHtml(k, o, tab) {
      var body = k === "level"
        ? '<span class="v7-lvl-name">' + esc(o.name) + '</span><span class="v7-lvl-note">' + esc(o.note) + '</span>'
        : '<span class="v7-opt-name">' + esc(o.name) + '</span><span class="v7-opt-reach mono" aria-hidden="true">' + (o.n == null ? "—" : "~" + fmt(o.n)) +
          '</span><span class="sr-only">' + (o.n == null ? "aholi raqami yo‘q" : spoken(o.n)) + '</span>';
      return '<button type="button" class="seg-btn v7-opt' + (k === "level" ? " v7-lvl" : "") + '" role="radio" aria-checked="' + (S[k] === o.v) +
        '" tabindex="' + (tab ? "0" : "-1") + '"' + (o.off ? " disabled" : "") + ' data-pick="' + esc(o.v) + '">' + body + '</button>';
    }
    function renderStage(st, idx) {
      active = idx < 0 ? null : st[idx];
      if (!active) { stage.hidden = true; stage.innerHTML = ""; ["role", "aria-labelledby", "aria-describedby"].forEach(function (a) { stage.removeAttribute(a); }); return; }
      stage.hidden = false;
      var k = active, opts = optionsFor(k), tab = 0;   // roving tabindex: radiogruppa — bitta Tab to'xtashi, o'chirilgani to'xtash bo'la olmaydi
      opts.forEach(function (o, i) { if (S[k] === o.v && !o.off) tab = i; });  while (opts[tab] && opts[tab].off) tab += 1;
      /* «· N tadan» faqat daraja ma'lum bo'lganda rost: daraja savoli ochiq turganda u bekor qilinayotgan javobdan qolgan va'da bo'lardi. */
      stage.innerHTML = '<p class="eyebrow eyebrow-sm" id="v7-step">Savol ' + (idx + 1) + (k === "level" ? "" : " · " + st.length + " tadan") +
        '</p><h4 class="v7-q" id="v7-qtext">' + ASK[k] + '</h4>' + (opts.length
          ? '<p class="hint">' + hintFor(k) + '</p><div class="v7-opts' + (k === "level" ? " v7-lvls" : "") +
            '">' + opts.map(function (o, i) { return optHtml(k, o, i === tab); }).join("") + '</div>'
          : '<div class="empty"><span class="empty-icon">' + svg('<path d="M4 7h16M4 12h10M4 17h7"/>') + '</span><p class="empty-title">' +
            'Bu bosqich uchun ro‘yxat bo‘sh</p><p class="small" id="v7-empty">Ma’lumot to‘plamida bu hudud ichida quyi birlik keltirilmagan. ' +
            'Tepadagi javoblardan birini o‘zgartiring, darajani bir pog‘ona yuqori oling yoki boshidan boshlang.</p>' +
            '<button type="button" class="btn btn-ghost btn-sm" data-reset>Boshidan tanlash</button></div>');
      /* Bo'sh bosqich boshi berk ko'cha: chiqish yo'li guruh TA'RIFIGA ulanadi, aks holda fokus guruhga tushganda faqat savol o'qilardi. */
      stage.setAttribute("role", opts.length ? "radiogroup" : "group"); stage.setAttribute("aria-labelledby", "v7-step v7-qtext");
      stage.removeAttribute("aria-describedby"); if (!opts.length) stage.setAttribute("aria-describedby", "v7-empty");
      enter(stage);
    }
    function renderTrail(st, idx, just) {
      var vis = st.slice(0, idx < 0 ? st.length : idx);
      trail.innerHTML = vis.map(function (k, j) {
        var v = k === "level" ? levelName() : S[k];
        /* Ogohlantirish faqat ROST bo'lganda: oxirgi javob hech nimani tozalamaydi, soxta ogohlantirish esa qaytish yo'lidan qo'rqitardi. */
        return '<li><button type="button" class="v7-crumb v7-anim" data-edit="' + k + '" aria-label="' + esc(TAG[k]) + ': ' + esc(v) + '. ' +
          (j < vis.length - 1 ? 'O‘zgartirish — bundan keyingi javoblar tozalanadi.' : 'O‘zgartirish.') + '"><span class="eyebrow eyebrow-sm v7-crumb-k">' +
          TAG[k] + '</span><span class="v7-crumb-v">' + esc(v) + '</span><span class="v7-crumb-e" aria-hidden="true">o‘zgartirish</span></button></li>';
      }).join("");
      var el = just && trail.querySelector('[data-edit="' + just + '"]');
      if (el) enter(el);
    }
    function renderRes(done) {
      if (!done) {
        res.setAttribute("data-state", "empty");
        res.innerHTML = '<div class="empty"><span class="empty-icon">' + svg('<circle cx="12" cy="12" r="7.5"/><circle cx="12" cy="12" r="2.5"/>') +
          '</span><p class="empty-title">Qamrov hali aniqlanmagan</p><p class="small">Yuqoridagi savolga javob bering — tanlangan yo‘l va taxminiy aholi soni shu yerda yig‘iladi.</p></div>';
        return;
      }
      /* Ulush faqat surat ham, maxraj ham haqiqiy son bo'lganda: aks holda «~Infinity%» yoki «~NaN%» aniq fakt qiyofasida chiqib ketardi. */
      var r = reach(), p = r != null && TOTAL.pop ? (r / TOTAL.pop) * 100 : null;
      var cap = S.level === "republic" ? "Barcha " + REGIONS.length + " hudud" : p == null ? "" : "Respublika aholisining ~" + (p >= 1 ? p.toFixed(1) : p >= 0.1 ? p.toFixed(2) : p.toFixed(3)) + "%";
      res.setAttribute("data-state", "done");
      /* Ajratkich HAQIQIY matn: CSS `::before` ni SR o'qimaydi va yo'l «Xorazm viloyatiQo'shko'pir tumani» bo'lib qo'shilardi. */
      res.innerHTML = '<p class="eyebrow eyebrow-sm">Taxminiy qamrov</p><p class="v7-num mono"><span aria-hidden="true">' + (r == null ? "—" : "~" + fmt(r)) +
        ' <span class="v7-num-u">' + (r == null ? "aholi raqami yo‘q" : "kishi") + '</span></span><span class="sr-only">' +
        (r == null ? "aholi raqami yo‘q" : spoken(r)) + '</span></p><p class="v7-path">' +
        pathParts().map(esc).join('<span class="v7-sep"> · </span>') + '</p>' + (r == null
          ? '<p class="note note-warn">' + WARN + '<span>Bu birlik uchun aholi raqami ma’lumot to‘plamida yo‘q — raqam o‘ylab topilmaydi.</span></p>'
          : '<p class="hint">' + (cap ? cap + " · raqamlar" : "Raqamlar") + ' taxminiy, aniq son reestrdan olinadi.</p>') +
        '<p class="hint">Bu sahifa faqat qamrovni tanlaydi — hech narsa yuborilmaydi.</p>' +
        '<button type="button" class="btn btn-ghost btn-sm" data-reset>Boshidan tanlash</button>';
    }

    function render(just) {
      var st = steps(), idx = -1;
      if (editing && st.indexOf(editing) >= 0) idx = st.indexOf(editing);
      else { editing = null; for (var i = 0; i < st.length; i++) if (!S[st[i]]) { idx = i; break; } }
      shown = idx < 0 ? st.length : idx;
      renderTrail(st, idx, just); renderStage(st, idx); renderRes(idx < 0);
      /* Yakuniy natija ham, boshi berk holat ham ekranda ko'rinadi — status mintaqasi ularni SR ga aytadi. Savolni fokus ko'chishi o'qitadi. */
      live.textContent = idx < 0 ? "Qamrov tanlandi: " + pathParts().join(", ") + " — " + (reach() == null ? "aholi raqami yo‘q." : spoken(reach()) + ".")
        : stage.querySelector("[data-pick]") ? "" : "Bu bosqichda variant yo‘q. Tepadagi javobni o‘zgartiring yoki boshidan boshlang.";
    }
    /* Hodisa EKRANNI o'lchaydi: qayta so'ralayotgan pog'ona `null` chiqadi — aks holda ekran «aniqlanmagan» deb turganda host eski qamrovni ushlab qolardi. */
    function emit() {
      var st = steps(), d = { level: null, region: null, district: null, mahalla: null, reach: shown === st.length ? reach() : null };
      for (var i = 0; i < shown; i++) d[st[i]] = S[st[i]];
      root.dispatchEvent(new CustomEvent("scopechange", { bubbles: true, detail: d }));
    }
    /* Javob berilgan savol DOM dan chiqadi — fokus ko'chirilmasa `body` ga tushib ketadi va klaviatura foydalanuvchisi joyini yo'qotadi. */
    function moveFocus() { (stage.hidden ? res : stage.querySelector('[data-pick][tabindex="0"]') || stage).focus(); }
    /* Chizishda xato bo'lsa ekran ESKI raqamni ko'rsatib turaverardi — jim yutish o'rniga sabab yoziladi. */
    function fail(err) {
      live.textContent = "Tanlov chizilmadi. Ekrandagi raqamga ishonmang, sahifani qayta yuklang.";
      if (!root.querySelector(".v7-fail")) root.insertAdjacentHTML("beforeend", '<p class="note note-crit v7-fail">' + WARN + '<span><b>Tanlov chizilmadi.</b> ' + esc((err && err.message) || err) + '. Ekrandagi raqamga ishonmang — sahifani qayta yuklang.</span></p>');
    }
    root.addEventListener("click", function (e) {
      var t = e.target.closest ? e.target : e.target.parentElement;
      if (!t) return;
      var pick = t.closest("[data-pick]"), crumb = t.closest("[data-edit]"), just = null;
      if (pick && active && !pick.disabled) { just = active; clearBelow(active); S[active] = pick.getAttribute("data-pick"); editing = null; }
      else if (crumb) { editing = crumb.getAttribute("data-edit"); clearBelow(editing); }
      else if (t.closest("[data-reset]")) { KEYS.forEach(function (k) { S[k] = null; }); editing = null; }
      else return;
      try { render(just); emit(); moveFocus(); } catch (err) { fail(err); }
    });
    /* O'q tugmalar fokusni ko'chiradi, TANLAMAYDI: radiogruppada tanlov odatda fokus bilan yuradi, lekin bu yerda
       tanlash keyingi savolni ochib yuboradi — ro'yxat bo'ylab yurib bo'lmasdi. Tanlash Enter/Bo'shliq bilan, ataylab. */
    root.addEventListener("keydown", function (e) {
      var cur = e.key && !stage.hidden && e.target.closest && e.target.closest("[data-pick]");
      if (!cur) return;
      var items = Array.prototype.slice.call(stage.querySelectorAll("[data-pick]:not([disabled])")), i = items.indexOf(cur);
      var d = e.key === "ArrowRight" || e.key === "ArrowDown" ? 1 : e.key === "ArrowLeft" || e.key === "ArrowUp" ? -1 : 0;
      var n = d ? (i + d + items.length) % items.length : e.key === "Home" ? 0 : e.key === "End" ? items.length - 1 : -1;
      if (n < 0 || !items[n]) return;
      e.preventDefault(); items.forEach(function (el) { el.tabIndex = -1; }); items[n].tabIndex = 0; items[n].focus();
    });
    try { render(); } catch (err) { fail(err); }
  })();
</script>
