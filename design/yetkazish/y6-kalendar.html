<!-- @name: Kalendar boshchiligida
     @idea: Ustunning bosh qahramoni — VAQT. Uchta yaqin sana kalendar
            varaqchasi bo‘lib tepada turadi (katta kun raqami, oy, kun nomi,
            soat), qamrov va ilova esa ostidagi ixcham qatorlarga tushadi.
     @best: Takroriy jadvalda — «qaysi kunlarda ketadi?» degan savol bir
            qarashda javob oladi, sanani o‘qish uchun matn skanerlanmaydi.
     @cost: «Hoziroq» rejimida kalendar bo‘shab qoladi va uchta varaqcha
            o‘rniga bitta blok turadi — ierarxiya rejimdan rejimga
            o‘zgaradi. Qamrov soni ikkinchi darajaga tushadi. -->
<section class="y6" data-variant="6" aria-label="Yetkazish ma’lumotlari">
  <div class="y6-card">
    <div class="y6-head">
      <span class="y6-kicker">Keyingi yuborish</span>
      <span class="y6-tz">Toshkent · UTC+5</span>
    </div>
    <div id="y6-when"></div>
    <ul class="y6-rows" id="y6-rows"></ul>
  </div>
</section>

<style>
.y6-card { background: var(--paper); border-radius: var(--r-container);
           box-shadow: inset 0 0 0 1px var(--hairline); overflow: hidden; }
.y6-head { display: flex; align-items: baseline; justify-content: space-between; gap: 10px;
           padding: 13px 16px 0; }
.y6-kicker, .y6-tz { font-family: var(--mono); font-size: var(--t-mono-sm); letter-spacing: var(--ls-mono);
                     text-transform: uppercase; color: var(--ink-2); }
/* `--ink-3` DEKORATIV — bu qator MATN, shuning uchun `--ink-2` da qoladi. */

.y6-days { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px;
           padding: 12px 16px 16px; }
/* Kalendar varaqchasi: raqam katta, qolgani mayda. Ustki chiziq — varaqning
   «tikilgan» cheti, dekorativ emas: u kartani kalendar sifatida o'qitadi. */
.y6-day { padding: 9px 8px 10px; border-radius: var(--r-panel); background: var(--paper-alt);
          box-shadow: inset 0 0 0 1px var(--hairline); border-top: 2px solid var(--ink);
          text-align: center; min-width: 0; }
.y6-dd { font-family: var(--mono); font-weight: 500; font-size: 22px; line-height: 1.05;
         color: var(--ink); font-variant-numeric: tabular-nums; }
.y6-mon { margin-top: 2px; font-family: var(--mono); font-size: var(--t-mono-sm);
          letter-spacing: var(--ls-mono); text-transform: uppercase; color: var(--ink-2); }
.y6-dow { margin-top: 6px; font-size: var(--t-sm); letter-spacing: var(--ls-sm); color: var(--ink-2);
          overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.y6-time { margin-top: 2px; font-family: var(--mono); font-size: var(--t-mono-sm);
           letter-spacing: var(--ls-mono); color: var(--ink); font-variant-numeric: tabular-nums; }

/* Bitta blok — «hoziroq» va bo'sh holat uchun. Uch varaqcha o'rniga
   soxta kalendar chizish YOLG'ON bo'lardi: sana yo'q. */
.y6-single { margin: 12px 16px 16px; padding: 14px; border-radius: var(--r-panel);
             background: var(--paper-alt); box-shadow: inset 0 0 0 1px var(--hairline); }
.y6-single[data-empty="true"] { background: transparent;
                                box-shadow: inset 0 0 0 1px var(--hairline-2); }
.y6-single-big { font-family: var(--mono); font-weight: 500; font-size: 21px; line-height: 1.1;
                 color: var(--ink); }
.y6-single[data-empty="true"] .y6-single-big { font-family: var(--sans); font-weight: 400;
                                               font-size: var(--t-body); color: var(--ink); }
.y6-single-sub { margin-top: 5px; font-size: var(--t-ui); line-height: 1.45; color: var(--ink-2); }
.y6-pattern { padding: 0 16px 14px; margin-top: -6px; font-size: var(--t-ui); line-height: 1.45;
              color: var(--ink-2); }

.y6-rows { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--hairline); }
.y6-row { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 12px;
          padding: 12px 16px; align-items: start; }
.y6-row + .y6-row { border-top: 1px solid var(--hairline); }
.y6-row .ico { width: 16px; height: 16px; color: var(--ink-3); margin-top: 2px; }
.y6-term { font-family: var(--mono); font-size: var(--t-mono-sm); letter-spacing: var(--ls-mono);
           text-transform: uppercase; color: var(--ink-2); }
.y6-val { margin-top: 3px; font-size: var(--t-body); line-height: 1.3; color: var(--ink);
          overflow-wrap: anywhere; }
.y6-val b { font-family: var(--mono); font-weight: 500; letter-spacing: var(--ls-mono);
            font-variant-numeric: tabular-nums; }
.y6-row[data-empty="true"] .y6-val { font-size: var(--t-ui); line-height: 1.45; color: var(--ink-2); }
/* Fayl nomlari 16px da 340px ustunni chetigacha to'ldirardi — ular ikkilamchi. */
.y6-quiet { font-size: var(--t-ui); line-height: 1.45; }
.y6-sub { margin-top: 2px; font-size: var(--t-sm); letter-spacing: var(--ls-sm); color: var(--ink-2);
          overflow-wrap: anywhere; }
</style>

<script>
(function () {
  "use strict";
  var root = document.querySelector('[data-variant="6"]');
  if (!root) return;
  var when = root.querySelector("#y6-when");
  var rows = root.querySelector("#y6-rows");

  function esc(s) {
    return String(s).replace(/[&<>"]/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c];
    });
  }
  function row(icon, term, val, sub, empty) {
    return '<li class="y6-row" data-empty="' + (empty ? "true" : "false") + '">' +
           '<svg class="ico" aria-hidden="true" focusable="false"><use href="#i-' + icon + '"/></svg>' +
           '<div><p class="y6-term">' + esc(term) + '</p><p class="y6-val">' + val + '</p>' +
           (sub ? '<p class="y6-sub">' + esc(sub) + '</p>' : "") + '</div></li>';
  }

  function render(d) {
    d = d || { reach: null, path: null, when: "none", runs: [], files: [] };

    if (d.when === "repeat" && d.runs.length) {
      when.innerHTML = '<div class="y6-days">' + d.runs.map(function (r) {
        return '<div class="y6-day"><p class="y6-dd">' + esc(r.dd) + '</p>' +
               '<p class="y6-mon">' + esc(r.mon) + '</p>' +
               '<p class="y6-dow">' + esc(r.day) + '</p>' +
               '<p class="y6-time">' + esc(r.time) + '</p></div>';
      }).join("") + '</div>' +
      (d.whenLine ? '<p class="y6-pattern">' + esc(d.whenLine) + '</p>' : "");
    } else if (d.when === "now") {
      when.innerHTML = '<div class="y6-single" data-empty="false">' +
        '<p class="y6-single-big">Hoziroq</p>' +
        '<p class="y6-single-sub">Kalendar yo‘q — xabar navbatga qo‘yilgan zahoti ketadi.</p></div>';
    } else {
      when.innerHTML = '<div class="y6-single" data-empty="true">' +
        '<p class="y6-single-big">Vaqt tanlanmagan</p>' +
        '<p class="y6-single-sub">03-bo‘limda sana va soatni belgilang — sanalar shu yerda chiqadi.</p></div>';
    }

    var html = d.reach
      ? row("users", "Qamrov", '<b>~' + esc(d.reach) + '</b> kishi',
            (d.path || []).join(" / ") + " · taxminiy", false)
      : row("users", "Qamrov", "Qamrov tanlanmagan", "01-bo‘limdan hududni tanlang", true);

    html += d.files.length
      ? row("file-text", "Ilova", '<span class="y6-quiet">' + esc(d.files.join(", ")) + '</span>', null, false)
      : row("file-text", "Ilova", "Fayl biriktirilmagan", "Ixtiyoriy", true);

    rows.innerHTML = html;
  }

  root.addEventListener("om:data", function (e) { render(e.detail); });
  render(null);
})();
</script>
