<!-- @name: Raqamlangan qatorlar
     @idea: Quti yo‘q — struktura faqat tipografiya va chiziq bilan
            beriladi: mono indeks (01/02/03), to‘liq enlik hairline, yorliq
            chapda, qiymat o‘ng ustunda. Eng kam aralashuv.
     @best: Kompozitorda ustun allaqachon halqali kartaning ICHIDA turadi —
            bu variant unga yana bir quti qo‘shmaydi va telefon ko‘rinishi
            bilan raqobatlashmaydi.
     @cost: Chegara yo‘q, demak ustun fonda «suzib» turganday tuyulishi
            mumkin — hozirgi kamchilikning bir qismi shu edi. Qiymatlar
            o‘ng ustunda: uzun yo‘l ikki qatorga tushadi. -->
<section class="y4" data-variant="4" aria-label="Yetkazish ma’lumotlari">
  <p class="y4-kicker">Yetkazish</p>
  <dl class="y4-rows" id="y4-rows"></dl>
</section>

<style>
.y4-kicker { font-family: var(--mono); font-size: var(--t-mono-sm); letter-spacing: var(--ls-mono);
             text-transform: uppercase; color: var(--ink-2); }
.y4-rows { margin: 0; padding: 0; }
/* Uch ustun: indeks · yorliq · qiymat. Indeks tor va QAT'IY — u qatorlarni
   sanaydi, demak ko'z «nechta fakt bor» degan savolga skanersiz javob oladi. */
.y4-row { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 4px 12px;
          padding: 14px 0; border-top: 1px solid var(--hairline-2); }
.y4-row:first-child { margin-top: 12px; }
/* `--ink-3` DEKORATIV (3.35:1) — indeks matn, shuning uchun `--ink-2`. */
.y4-num { grid-row: 1 / span 2; font-family: var(--mono); font-size: var(--t-mono-sm);
          letter-spacing: var(--ls-mono); color: var(--ink-2); padding-top: 2px;
          font-variant-numeric: tabular-nums; }
.y4-term { font-family: var(--mono); font-size: var(--t-mono-sm); letter-spacing: var(--ls-mono);
           text-transform: uppercase; color: var(--ink-2); margin: 0; }
.y4-def { margin: 0; min-width: 0; }

.y4-value { font-size: var(--t-lead); line-height: 1.25; letter-spacing: var(--ls-lead);
            color: var(--ink); overflow-wrap: anywhere; }
.y4-value b { font-family: var(--mono); font-weight: 500; letter-spacing: var(--ls-mono);
              font-variant-numeric: tabular-nums; }
.y4-row[data-empty="true"] .y4-value { font-size: var(--t-ui); line-height: 1.45;
                                       letter-spacing: 0; color: var(--ink-2); }
.y4-sub { margin-top: 3px; font-size: var(--t-ui); line-height: 1.45; color: var(--ink-2);
          overflow-wrap: anywhere; }

.y4-runs { list-style: none; margin: 8px 0 0; padding: 0; display: grid; gap: 5px; }
.y4-run { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 10px; align-items: baseline; }
.y4-run b, .y4-run i { font-family: var(--mono); font-size: var(--t-mono-sm); letter-spacing: var(--ls-mono);
                       font-variant-numeric: tabular-nums; font-style: normal; }
.y4-run b { font-weight: 500; color: var(--ink); }
.y4-run i { color: var(--ink-2); }
.y4-run span { font-size: var(--t-sm); letter-spacing: var(--ls-sm); color: var(--ink-2);
               overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

.y4-files { list-style: none; margin: 6px 0 0; padding: 0; display: grid; gap: 3px; }
.y4-files li { font-size: var(--t-ui); line-height: 1.4; color: var(--ink-2); overflow-wrap: anywhere; }
</style>

<script>
(function () {
  "use strict";
  var root = document.querySelector('[data-variant="4"]');
  if (!root) return;
  var rows = root.querySelector("#y4-rows");

  function esc(s) {
    return String(s).replace(/[&<>"]/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c];
    });
  }
  /* `<dl>` ichida `dt`/`dd` `<div>` bilan guruhlanadi — HTML5 da amal
     qiladigan yagona usul, ekran o'quvchi juftlikni buzmaydi. */
  function row(n, term, value, sub, empty, extra) {
    return '<div class="y4-row" data-empty="' + (empty ? "true" : "false") + '">' +
           '<span class="y4-num" aria-hidden="true">' + n + '</span>' +
           '<dt class="y4-term">' + esc(term) + '</dt>' +
           '<dd class="y4-def"><p class="y4-value">' + value + '</p>' +
           (sub ? '<p class="y4-sub">' + esc(sub) + '</p>' : "") + (extra || "") + '</dd></div>';
  }

  function render(d) {
    d = d || { reach: null, path: null, when: "none", runs: [], files: [] };
    var html = "";

    html += d.reach
      ? row("01", "Qamrov", '<b>~' + esc(d.reach) + '</b> kishi',
            (d.path || []).join(" / ") + " · taxminiy", false)
      : row("01", "Qamrov", "Qamrov tanlanmagan", "01-bo‘limdan hududni tanlang", true);

    if (d.when === "now") {
      html += row("02", "Keyingi yuborish", "Hoziroq", "Navbatga qo‘yilgan zahoti", false);
    } else if (d.when === "repeat" && d.runs.length) {
      html += row("02", "Keyingi yuborish", esc(d.whenLine || "Takroriy jadval"), null, false,
        '<ul class="y4-runs">' + d.runs.map(function (r) {
          return '<li class="y4-run"><b>' + esc(r.iso) + '</b><span>' + esc(r.day) +
                 '</span><i>' + esc(r.time) + '</i></li>';
        }).join("") + '</ul>');
    } else {
      html += row("02", "Keyingi yuborish", "Vaqt tanlanmagan",
                  "03-bo‘limda sana va soatni belgilang", true);
    }

    html += d.files.length
      ? row("03", "Ilova", d.files.length + " ta fayl", null, false,
            '<ul class="y4-files">' + d.files.map(function (f) {
              return "<li>" + esc(f) + "</li>";
            }).join("") + '</ul>')
      : row("03", "Ilova", "Fayl biriktirilmagan", "Ixtiyoriy — xabar ilovasiz ham ketadi", true);

    rows.innerHTML = html;
  }

  root.addEventListener("om:data", function (e) { render(e.detail); });
  render(null);
})();
</script>
