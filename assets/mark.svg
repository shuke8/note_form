<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" role="img" aria-label="Onlayn Mahalla">
  <title>Onlayn Mahalla</title>
  <!-- Xabarning mahalladan hududga tarqalishi: markaz to'la, halqalar
       uzoqlashgani sari siyraklashadi. Piksel to'ri — texnik chizma tili. -->
  <g fill="currentColor">
    <rect x="10" y="10" width="4" height="4"/>
    <rect x="5"  y="10" width="4" height="4" opacity=".62"/>
    <rect x="15" y="10" width="4" height="4" opacity=".62"/>
    <rect x="10" y="5"  width="4" height="4" opacity=".62"/>
    <rect x="10" y="15" width="4" height="4" opacity=".62"/>
    <rect x="5"  y="5"  width="4" height="4" opacity=".26"/>
    <rect x="15" y="5"  width="4" height="4" opacity=".26"/>
    <rect x="5"  y="15" width="4" height="4" opacity=".26"/>
    <rect x="15" y="15" width="4" height="4" opacity=".26"/>
    <rect x="0"  y="10" width="4" height="4" opacity=".14"/>
    <rect x="20" y="10" width="4" height="4" opacity=".14"/>
    <rect x="10" y="0"  width="4" height="4" opacity=".14"/>
    <rect x="10" y="20" width="4" height="4" opacity=".14"/>
  </g>
</svg>
